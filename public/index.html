<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Free Online Games | Online Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header" id="header">
    <div class="header-left">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a href="/" class="logo">
        <div class="logo-icon"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#6842FF"/><circle cx="14" cy="16" r="3" fill="#fff"/><circle cx="26" cy="16" r="3" fill="#fff"/><circle cx="14" cy="16" r="1.5" fill="#0C0D14"/><circle cx="26" cy="16" r="1.5" fill="#0C0D14"/><path d="M13 24c2 3 12 3 14 0" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/><ellipse cx="10" cy="10" rx="4" ry="5" fill="#6842FF" transform="rotate(-20 10 10)"/><ellipse cx="30" cy="10" rx="4" ry="5" fill="#6842FF" transform="rotate(20 30 10)"/></svg></div>
        <span class="logo-text">Online<span class="logo-accent">Game</span></span>
      </a>
    </div>
    <form class="search-bar" id="searchBar" onsubmit="return false">
      <svg class="search-bar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b8fa3" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" class="search-bar-input" id="searchBarInput" placeholder="Search games and categories" readonly>
      <kbd class="search-kbd">Ctrl K</kbd>
    </form>
    <div class="header-right">
      <button class="user-btn" id="userBtn" aria-label="Account">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="user-btn-label" id="userBtnLabel">Login</span>
      </button>
      <div class="user-dropdown" id="userDropdown">
        <div class="user-dropdown-header" id="userDropdownHeader"></div>
        <a href="#" class="user-dropdown-item" id="dropdownProfile"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> My Profile</a>
        <a href="#" class="user-dropdown-item" id="dropdownFavorites"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> Favorites</a>
        <a href="#" class="user-dropdown-item" id="dropdownPlayed"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Recently Played</a>
        <div class="user-dropdown-divider"></div>
        <a href="/admin/" class="user-dropdown-item" id="dropdownAdmin"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Admin Panel</a>
        <button class="user-dropdown-item logout" id="dropdownLogout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg> Logout</button>
      </div>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-section">
        <a href="#" class="sidebar-link active" data-nav="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Home</span></a>
        <a href="#" class="sidebar-link" data-nav="recent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Recently Played</span></a>
        <a href="#" class="sidebar-link" data-nav="new"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><span>New Games</span></a>
        <a href="#" class="sidebar-link" data-nav="trending"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Trending</span></a>
        <a href="#" class="sidebar-link" data-nav="originals"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg><span>Originals</span></a>
        <a href="#" class="sidebar-link" data-nav="multiplayer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><span>Multiplayer</span></a>
        <a href="#" class="sidebar-link" data-nav="leaderboards"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="10" width="4" height="12" rx="1"/><rect x="10" y="4" width="4" height="18" rx="1"/><rect x="18" y="8" width="4" height="14" rx="1"/></svg><span>Leaderboards</span></a>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section" id="categoryNav"></div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section sidebar-bottom">
        <button class="sidebar-contact"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Contact Us</button>
        <div class="sidebar-links">
          <a href="#">About</a><a href="#">Developers</a><a href="#">Kids site</a><a href="#">Terms</a><a href="#">Privacy</a><a href="#">All games</a>
        </div>
        <div class="sidebar-social">
          <a href="#" class="social-btn" aria-label="Discord"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></a>
          <a href="#" class="social-btn" aria-label="YouTube"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a>
          <a href="#" class="social-btn" aria-label="TikTok"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 0010.86 4.48v-7.37a8.16 8.16 0 005.58 2.18v-3.45a4.85 4.85 0 01-3-.77V6.69h3z"/></svg></a>
          <a href="#" class="social-btn" aria-label="LinkedIn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
        </div>
        <div class="sidebar-copy">&copy; 2026 Online Game. All rights reserved.</div>
      </div>
    </div>
  </nav>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content" id="mainContent">
    <div class="bg-gradient"></div>
    <div class="content-wrapper" id="contentWrapper">
      <div class="page-loader"><div class="loader-dots"><span></span><span></span><span></span></div></div>
    </div>
  </main>

  <!-- Auth Modal (Login + Signup combined) -->
  <div class="modal" id="authModal">
    <div class="modal-backdrop" id="authBackdrop"></div>
    <div class="modal-card auth-card">
      <button class="modal-x" id="authClose">&times;</button>
      <div class="auth-header">
        <svg width="48" height="48" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#6842FF"/><circle cx="14" cy="16" r="3" fill="#fff"/><circle cx="26" cy="16" r="3" fill="#fff"/><circle cx="14" cy="16" r="1.5" fill="#0C0D14"/><circle cx="26" cy="16" r="1.5" fill="#0C0D14"/><path d="M13 24c2 3 12 3 14 0" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <h2 id="authTitle">Welcome Back</h2>
        <p id="authSubtitle">Sign in to continue playing</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Login</button>
        <button class="auth-tab" id="tabSignup">Sign Up</button>
      </div>
      <button class="google-btn" id="googleBtn">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        <span>Continue with Google</span>
      </button>
      <div class="auth-divider"><span>or</span></div>
      <form id="authForm">
        <div class="form-field" id="nameField" style="display:none">
          <label>Full Name</label>
          <input type="text" id="authName" placeholder="Enter your name">
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="authEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-field">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="authPassword" placeholder="Enter password" required>
            <button type="button" class="pw-toggle" id="pwToggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="auth-submit" id="authSubmit">Login</button>
      </form>
    </div>
  </div>

  <!-- Search Modal -->
  <div class="modal" id="searchModal">
    <div class="modal-backdrop" id="searchBackdrop"></div>
    <div class="modal-card search-card">
      <div class="search-card-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b8fa3" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchModalInput" placeholder="Search games and categories..." autofocus>
        <button class="search-esc" id="searchEsc">ESC</button>
      </div>
      <div class="search-card-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Game Play Modal -->
  <div class="modal" id="gameModal">
    <div class="modal-backdrop" id="gameBackdrop"></div>
    <div class="modal-card game-play-card">
      <button class="modal-x" id="gameClose">&times;</button>
      <div class="game-play-header">
        <h2 id="gamePlayTitle"></h2>
        <div class="game-play-meta">
          <span class="game-play-category" id="gamePlayCategory"></span>
          <span class="game-play-plays" id="gamePlayPlays"></span>
        </div>
      </div>
      <div class="game-play-iframe-wrap">
        <div class="game-play-placeholder" id="gamePlaceholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#6842FF" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <p>Click to play</p>
        </div>
        <iframe id="gameIframe" style="display:none" allowfullscreen></iframe>
      </div>
      <div class="game-play-actions">
        <button class="game-action-btn" id="likeBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> <span id="likeCount">0</span></button>
        <button class="game-action-btn" id="shareBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg> Share</button>
        <button class="game-action-btn" id="fullscreenBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg> Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/script.js"></script>
</body>
</html>
