<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Minesweeper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1019;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;padding:10px}
h1{font-size:clamp(24px,6vw,38px);font-weight:800;background:linear-gradient(135deg,#6842FF,#8660FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
#board{display:grid;gap:3px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.cell{width:min(9vw,34px);height:min(9vw,34px);background:#1e2033;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;cursor:pointer;user-select:none;transition:background .1s}
.cell:hover{background:#2a2d44}
.cell.open{background:rgba(255,255,255,.04);cursor:default}
.cell.mine{background:#ff2e63}
.cell.flag{background:rgba(255,255,255,.1)}
.n1{color:#4da6ff}.n2{color:#2ee6a8}.n3{color:#ff2e63}.n4{color:#8660FF}.n5{color:#ff7a3d}.n6{color:#ffb84d}.n7{color:#fff}.n8{color:#aaa}
#ui{display:flex;gap:12px;margin-top:12px;align-items:center}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 16px;text-align:center}
.box .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888}
.box .v{font-size:18px;font-weight:700;color:#6842FF}
button{padding:9px 20px;font-size:13px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#6842FF,#8660FF);color:#fff;cursor:pointer;box-shadow:0 10px 25px rgba(104,66,255,.35)}
button:hover{transform:translateY(-2px)}
select{padding:9px;font-size:13px;border-radius:10px;background:#1e2033;color:#fff;border:1px solid rgba(255,255,255,.15)}
</style>
</head>
<body>
<h1>Minesweeper</h1>
<div id="ui">
  <select id="diff" onchange="restart()">
    <option value="easy">Easy 9×9</option>
    <option value="medium" selected>Medium 16×16</option>
    <option value="hard">Hard 24×24</option>
  </select>
  <div class="box"><div class="l">Mines</div><div class="v" id="mines">0</div></div>
  <div class="box"><div class="l">Time</div><div class="v" id="time">0</div></div>
  <button onclick="restart()">New Game</button>
</div>
<div id="board"></div>
<script>
var boardEl=document.getElementById('board');
var SIZES={easy:{r:9,c:9,m:10},medium:{r:16,c:16,m:40},hard:{r:24,c:24,m:99}};
var R,C,M,grid,first,flags,cleared,over,secs,timer;
function restart(){var d=SIZES[document.getElementById('diff').value];R=d.r;C=d.c;M=d.m;
  grid=[];for(var r=0;r<R;r++){grid[r]=[];for(var c=0;c<C;c++)grid[r][c]={m:false,open:false,flag:false,n:0}}
  first=true;flags=0;cleared=0;over=false;secs=0;clearInterval(timer);document.getElementById('time').textContent=0;document.getElementById('mines').textContent=M;
  boardEl.style.gridTemplateColumns='repeat('+C+',minmax(0,1fr))';render()}
function plant(sr,sc){var placed=0;while(placed<M){var r=Math.floor(Math.random()*R),c=Math.floor(Math.random()*C);if(grid[r][c].m||(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1))continue;grid[r][c].m=true;placed++}
for(var r=0;r<R;r++)for(var c=0;c<C;c++){if(grid[r][c].m)continue;var n=0;for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;var rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C&&grid[rr][cc].m)n++}grid[r][c].n=n}}
function open(r,c){if(r<0||r>=R||c<0||c>=C||grid[r][c].open||grid[r][c].flag||over)return;
  if(first){plant(r,c);first=false;timer=setInterval(function(){secs++;document.getElementById('time').textContent=secs},1000)}
  var g=grid[r][c];g.open=true;cleared++;
  if(g.m){g.boom=true;end(false);return}
  if(g.n===0){for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++)open(r+dr,c+dc)}
  if(cleared===R*C-M)end(true);
  render()}
function toggleFlag(r,c){var g=grid[r][c];if(g.open||over)return;g.flag=!g.flag;flags+=g.flag?1:-1;document.getElementById('mines').textContent=M-flags;render()}
function end(win){over=true;clearInterval(timer);if(win){document.querySelectorAll('.cell.m').forEach(function(x){x.classList.add('open');x.textContent='🚩'})}else{document.querySelectorAll('.cell.m').forEach(function(x){if(!x.classList.contains('flag')){x.classList.add('open');x.textContent='💣'}})}
render();setTimeout(function(){alert(win?'You Win! 🎉 — '+secs+'s':'Game Over 💥')},30)}
function render(){var html='';for(var r=0;r<R;r++)for(var c=0;c<C;c++){var g=grid[r][c];var cls='cell';if(g.open)cls+=' open';if(g.flag)cls+=' flag';var txt='';
  if(g.open&&g.m){cls+=' mine';txt='💣'}else if(g.flag){txt='🚩'}else if(g.open&&g.n>0){txt=g.n;cls+=' n'+g.n}
  html+='<div class="'+cls+'" data-r="'+r+'" data-c="'+c+'">'+txt+'</div>'}
  boardEl.innerHTML=html}
boardEl.addEventListener('click',function(e){var t=e.target.closest('.cell');if(!t)return;open(+t.dataset.r,+t.dataset.c)});
boardEl.addEventListener('contextmenu',function(e){e.preventDefault();var t=e.target.closest('.cell');if(t)toggleFlag(+t.dataset.r,+t.dataset.c)});
restart();
</script>
</body>
</html>
