<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breakout</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1019;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden}
h1{font-size:clamp(26px,6vw,40px);font-weight:800;background:linear-gradient(135deg,#6842FF,#8660FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
canvas{background:#14152a;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6);touch-action:none}
#ui{display:flex;gap:12px;margin-top:14px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 18px;text-align:center}
.box .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888}
.box .v{font-size:20px;font-weight:700;color:#6842FF}
button{margin-top:14px;padding:11px 26px;font-size:14px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#6842FF,#8660FF);color:#fff;cursor:pointer;box-shadow:0 10px 25px rgba(104,66,255,.35)}
button:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<h1>Breakout</h1>
<canvas id="cv" width="480" height="360"></canvas>
<div id="ui">
  <div class="box"><div class="l">Score</div><div class="v" id="score">0</div></div>
  <div class="box"><div class="l">Lives</div><div class="v" id="lives">3</div></div>
</div>
<button id="btn" onclick="restart()">Start Game</button>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=480,H=360;
var paddle={w:90,h:12},ball,paused=true,score=0,lives=3,over=false,bricks=[],keys={},raf;
var COLS=8,ROWS=5;
function buildBricks(){bricks=[];var bw=W/COLS,bh=20;for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)bricks.push({x:c*bw+2,y:r*bh+8+40,w:bw-4,h:bh-4,alive:true,color:['#ff2e63','#ff7a3d','#ffb84d','#6842FF','#8660FF'][r]})}
function reset(){paddle.x=W/2-paddle.w/2;paddle.y=H-24;ball={x:W/2,y:H-40,vx:3.4,vy:-3.4,r:6};score=0;lives=3;over=false;buildBricks();document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3}
function restart(){reset();paused=true;document.getElementById('btn').textContent='Click / Space to launch';document.getElementById('btn').style.display='inline-block';loop()}
function launch(){if(over){restart();return}paused=false;document.getElementById('btn').style.display='none'}
function loop(){
  raf=requestAnimationFrame(loop);
  if(paused){draw();return}
  var sp=paddle.w/2+20;if(keys['ArrowLeft']||keys['a'])paddle.x-=sp;if(keys['ArrowRight']||keys['d'])paddle.x+=sp;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<ball.r||ball.x>W-ball.r){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x))}
  if(ball.y<ball.r){ball.vy*=-1}
  if(ball.y+ball.r>paddle.y&&ball.y< paddle.y+paddle.h+6&&ball.x>paddle.x-ball.r&&ball.x<paddle.x+paddle.w+ball.r){ball.vy=-Math.abs(ball.vy);var hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*4.5;ball.y=paddle.y-ball.r}
  for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;
    if(ball.x+b.r>b.x&&ball.x-b.r<b.x+b.w&&ball.y+b.r>b.y&&ball.y-b.r<b.y+b.h){b.alive=false;score+=10;document.getElementById('score').textContent=score;
      var cx=b.x+b.w/2,cy=b.y+b.h/2,dx=ball.x-cx,dy=ball.y-cy;
      if(Math.abs(dx)>Math.abs(dy))ball.vx*=dx>0?-1:1;else ball.vy*=dy>0?-1:1;
      break}}
  if(ball.y>H){lives--;document.getElementById('lives').textContent=lives;if(lives<=0){gameOver()}else{paused=true;ball={x:W/2,y:H-40,vx:3.4,vy:-3.4};document.getElementById('btn').textContent='Click to continue ('+lives+' lives left)';document.getElementById('btn').style.display='inline-block'}}
  if(bricks.every(function(b){return !b.alive})){document.getElementById('btn').textContent='You Win! 🎉 — Play again';document.getElementById('btn').style.display='inline-block';paused=true}
  draw();
}
function gameOver(){over=true;document.getElementById('btn').textContent='Game Over — Score '+score+' · Play again';document.getElementById('btn').style.display='inline-block';paused=true}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(b.x,b.y,b.w,5)}
  var g=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x+paddle.w,paddle.y);g.addColorStop(0,'#6842FF');g.addColorStop(1,'#8660FF');
  ctx.fillStyle=g;ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(paddle.x,paddle.y,paddle.w,4);
  var bg=ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,ball.r+6);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#ffd94d');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
  if(paused&&!over){ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='700 18px Segoe UI';ctx.textAlign='center';ctx.fillText('Click / Space to launch',W/2,H/2)}
}
reset();
document.addEventListener('keydown',function(e){keys[e.key]=true;if(e.code==='Space'){e.preventDefault();launch()}});
document.addEventListener('keyup',function(e){keys[e.key]=false});
cv.addEventListener('pointerdown',function(e){e.preventDefault();launch()});
cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();paddle.x=(e.clientX-r.left)*W/r.width-paddle.w/2});
</script>
</body>
</html>
