<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f1019;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;overflow:hidden}
h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#6842FF,#8660FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.score-wrap{display:flex;gap:12px;margin:14px 0}
.score{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 16px;text-align:center}
.score .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888}
.score .val{font-size:20px;font-weight:700;color:#6842FF}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;width:min(92vw,420px);aspect-ratio:1;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tile{display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:10px;font-size:clamp(18px,6vw,34px);transition:transform .12s ease,background .12s,color .12s;user-select:none}
.t2{background:#2a2d3a;color:#e8e8f0}.t4{background:#3a2d4a;color:#e8e8f0}
.t8{background:#4a2d6a;color:#fff}.t16{background:#6842FF;color:#fff}
.t32{background:#7a55ff;color:#fff}.t64{background:#8660ff;color:#fff}
.t128{background:#a882ff;color:#0f1019}.t256{background:#c4a3ff;color:#0f1019}
.t512{background:#ffb84d;color:#0f1019}.t1024{background:#ff9f1c;color:#0f1019}
.t2048{background:#ff7a3d;color:#0f1019}
#overlay{position:fixed;inset:0;background:rgba(10,10,16,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;backdrop-filter:blur(6px);z-index:10}
#overlay h2{font-size:32px}
button{padding:12px 28px;font-size:15px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#6842FF,#8660FF);color:#fff;cursor:pointer;box-shadow:0 10px 25px rgba(104,66,255,.35)}
button:hover{transform:translateY(-2px)}
.hint{position:fixed;bottom:14px;font-size:11px;color:#555;text-align:center}
@media (max-width:480px){#board{gap:8px;padding:8px;border-radius:12px}}
</style>
</head>
<body>
<h1>2048</h1>
<div class="score-wrap">
  <div class="score"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
  <div class="score"><div class="lbl">Best</div><div class="val" id="best">0</div></div>
</div>
<div id="board"></div>
<div id="overlay"><h2 id="ov-title">Game Over</h2><button onclick="restart()">Play Again</button></div>
<div class="hint">Use arrow keys / WASD · swipe on mobile</div>
<script>
var board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
var grid,score,best=+localStorage.getItem('b2048')||0,over=0;bestEl.textContent=best;
function emptyCells(){var a=[];for(var i=0;i<16;i++)if(!grid[i])a.push(i);return a}
function spawn(){var e=emptyCells();if(!e.length)return;var c=e[Math.floor(Math.random()*e.length)];grid[c]=Math.random()<.9?2:4;render()}
function render(){var html='';for(var i=0;i<16;i++){var v=grid[i];html+='<div class="tile t'+(v||1)+'">'+((v&&v>1)?v:'')+'</div>'}board.innerHTML=html}
function slide(a){var b=[],moved=0;for(var i=0;i<a.length;i++){var v=a[i];if(v){var j=b.length-1;if(b[j]===v){b[j]=v*2;score+=v*2;moved=1}else b.push(v)}}while(b.length<4)b.push(0);for(i=0;i<4;i++)if(b[i]!==a[i])moved=1;return b}
function move(dir){if(over)return;var pre=grid.join(',');var rows=[];for(var r=0;r<4;r++){var row=[];for(var c=0;c<4;c++)row.push(grid[r*4+c]);if(dir==='l')rows.push(slide(row));else if(dir==='r')rows.push(slide(row.slice().reverse()).reverse());else rows.push(null)}
if(dir==='u'||dir==='d'){for(var c=0;c<4;c++){var col=[];for(var r=0;r<4;r++)col.push(grid[r*4+c]);var sl=slide(col);if(dir==='d')sl=slide(col.slice().reverse()).reverse();for(r=0;r<4;r++)grid[r*4+c]=sl[r]}}
else{for(r=0;r<4;r++){var rw=rows[r];for(c=0;c<4;c++)grid[r*4+c]=rw[c]}}
scoreEl.textContent=score;if(grid.join(',')!==pre){spawn();check()}}
function check(){var empty=false,max=0;for(var i=0;i<16;i++){var v=grid[i];if(!v){empty=true;continue}if(v>max)max=v}if(max>=2048){over=1;show('You Win! 🎉')}else if(!empty){for(var i=0;i<16;i++){var r=Math.floor(i/4),c=i%4;if(c<3&&grid[i]===grid[i+1])return;if(r<3&&grid[i]===grid[i+4])return}over=1;show('Game Over')}}
function show(t){document.getElementById('ov-title').textContent=t;document.getElementById('overlay').style.display='flex';if(score>best){best=score;localStorage.setItem('b2048',best);bestEl.textContent=best}}
function restart(){grid=new Array(16).fill(0);score=0;over=0;scoreEl.textContent=0;document.getElementById('overlay').style.display='none';spawn();spawn()}
document.addEventListener('keydown',function(e){var k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'};if(k[e.key]){e.preventDefault();move(k[e.key])}if(e.key==='r'||e.key==='R')restart()});
var ts=null;document.addEventListener('touchstart',function(e){ts=e.touches[0]},false);document.addEventListener('touchend',function(e){if(!ts)return;var dx=e.changedTouches[0].clientX-ts.clientX,dy=e.changedTouches[0].clientY-ts.clientY;ts=null;if(Math.abs(dx)<24&&Math.abs(dy)<24)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'r':'l');else move(dy>0?'d':'u');e.preventDefault()},false);
restart();
</script>
</body>
</html>
