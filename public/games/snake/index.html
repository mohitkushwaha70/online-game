<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1019;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden}
h1{font-size:clamp(26px,6vw,40px);font-weight:800;background:linear-gradient(135deg,#6842FF,#8660FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
canvas{background:#14152a;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#ui{display:flex;gap:12px;margin-top:14px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 18px;text-align:center}
.box .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888}
.box .v{font-size:20px;font-weight:700;color:#6842FF}
button{margin-top:14px;padding:11px 26px;font-size:14px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#6842FF,#8660FF);color:#fff;cursor:pointer;box-shadow:0 10px 25px rgba(104,66,255,.35)}
button:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<h1>Snake</h1>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ui">
  <div class="box"><div class="l">Score</div><div class="v" id="score">0</div></div>
  <div class="box"><div class="l">Best</div><div class="v" id="best">0</div></div>
</div>
<button id="btn" onclick="restart()">Start Game</button>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var CELL=20,COLS=20,ROWS=20,best=+localStorage.getItem('snakeBest')||0;
document.getElementById('best').textContent=best;
var snake,food,dir,nextDir,score,over,started,timer;
function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir='right';nextDir='right';score=0;over=false;spawn();document.getElementById('score').textContent=0}
function spawn(){var f;do{f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(function(s){return s.x===f.x&&s.y===f.y}));food=f}
function restart(){clearInterval(timer);reset();started=true;document.getElementById('btn').style.display='none';timer=setInterval(step,110)}
function step(){dir=nextDir;var h=snake[0],nx=h.x,nxy=h.y;
  if(dir==='right')nx++;else if(dir==='left')nx--;else if(dir==='down')nxy++;else nxy--;
  if(nx<0||nx>=COLS||nxy<0||nxy>=ROWS){gameOver();return}
  if(snake.some(function(s){return s.x===nx&&s.y===nxy})){gameOver();return}
  snake.unshift({x:nx,y:nxy});
  if(nx===food.x&&nxy===food.y){score++;document.getElementById('score').textContent=score;spawn()}
  else snake.pop();
  draw();
}
function gameOver(){over=true;clearInterval(timer);if(score>best){best=score;localStorage.setItem('snakeBest',best);document.getElementById('best').textContent=best}document.getElementById('btn').style.display='inline-block';document.getElementById('btn').textContent='Play Again — Score '+score}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='rgba(255,255,255,.02)';
  for(var x=0;x<COLS;x++)for(var y=0;y<ROWS;y++)if((x+y)%2===0)ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  var fg=ctx.createRadialGradient(food.x*CELL+10,food.y*CELL+10,2,food.x*CELL+10,food.y*CELL+10,12);
  fg.addColorStop(0,'#ff6b6b');fg.addColorStop(1,'#ff2e63');
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(food.x*CELL+10,food.y*CELL+10,9,0,7);ctx.fill();
  for(var i=0;i<snake.length;i++){var s=snake[i];
    var g=ctx.createLinearGradient(s.x*CELL,s.y*CELL,s.x*CELL+CELL,s.y*CELL+CELL);
    g.addColorStop(0,i===0?'#a882ff':'#6842FF');g.addColorStop(1,i===0?'#6842FF':'#3b2f8a');
    ctx.fillStyle=g;ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
  }
  var h=snake[0];ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h.x*CELL+14,h.y*CELL+7,2.5,0,7);ctx.arc(h.x*CELL+6,h.y*CELL+7,2.5,0,7);ctx.fill();
  if(!started){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='700 20px Segoe UI';ctx.textAlign='center';ctx.fillText('Arrow keys to move',cv.width/2,cv.height/2)}
}
reset();draw();
document.addEventListener('keydown',function(e){
  if(!started){restart();return}
  if(e.key==='ArrowUp'&&dir!=='down')nextDir='up';
  else if(e.key==='ArrowDown'&&dir!=='up')nextDir='down';
  else if(e.key==='ArrowLeft'&&dir!=='right')nextDir='left';
  else if(e.key==='ArrowRight'&&dir!=='left')nextDir='right';
  else return;e.preventDefault();
});
function sw(dir){if(!started){restart();return}if(dir==='up'&&dir!=='down')nextDir='up';else if(dir==='down'&&dir!=='up')nextDir='down';else if(dir==='left'&&dir!=='right')nextDir='left';else if(dir==='right'&&dir!=='left')nextDir='right'}
var ts=null;document.addEventListener('touchstart',function(e){ts=e.touches[0]},false);
document.addEventListener('touchend',function(e){if(!ts)return;var dx=e.changedTouches[0].clientX-ts.clientX,dy=e.changedTouches[0].clientY-ts.clientY;ts=null;if(Math.abs(dx)<24&&Math.abs(dy)<24)return;sw(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));e.preventDefault()},false);
</script>
</body>
</html>
