<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1019;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden}
h1{font-size:clamp(26px,6vw,40px);font-weight:800;background:linear-gradient(135deg,#6842FF,#8660FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
canvas{background:#14152a;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6);touch-action:none}
#ui{display:flex;gap:12px;margin-top:14px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 18px;text-align:center}
.box .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888}
.box .v{font-size:20px;font-weight:700;color:#6842FF}
button{margin-top:14px;padding:11px 26px;font-size:14px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#6842FF,#8660FF);color:#fff;cursor:pointer;box-shadow:0 10px 25px rgba(104,66,255,.35)}
button:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<h1>Flappy Bird</h1>
<canvas id="cv" width="360" height="520"></canvas>
<div id="ui">
  <div class="box"><div class="l">Score</div><div class="v" id="score">0</div></div>
  <div class="box"><div class="l">Best</div><div class="v" id="best">0</div></div>
</div>
<button id="btn" onclick="restart()">Start Game</button>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var best=+localStorage.getItem('flapBest')||0;document.getElementById('best').textContent=best;
var bird,vel,pipes,score,over,started,frame;
var G=.42,FLAP=-7.6,PIPE_W=60,GAP=150,SPEED=2.6;
function reset(){bird={x:90,y:cv.height/2,r:13};vel=0;pipes=[];score=0;over=false;started=false;frame=0;document.getElementById('score').textContent=0}
function restart(){reset();started=true;document.getElementById('btn').style.display='none';loop()}
function flap(){if(over){restart();return}if(!started)return;vel=FLAP;document.getElementById('btn').style.display='none'}
function loop(){
  requestAnimationFrame(loop);frame++;
  if(!started)return;
  vel+=G;bird.y+=vel;
  if(frame%70===0)pipes.push({x:cv.width+20,h:60+Math.random()*(cv.height-GAP-160)});
  for(var i=0;i<pipes.length;i++){pipes[i].x-=SPEED;if(pipes[i].x<PIPE_W&&!pipes[i].sc){pipes[i].sc=1;score++;document.getElementById('score').textContent=score}}
  pipes=pipes.filter(function(p){return p.x>-PIPE_W-10});
  if(bird.y<8)bird.y=8;
  var hit=false;
  if(bird.y+bird.r>=cv.height){hit=true}
  for(var i=0;i<pipes.length;i++){var p=pipes[i];
    var bY=p.h,y2=p.h+GAP;
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W){
      if(bird.y-bird.r<bY||bird.y+bird.r>y2)hit=true;
    }}
  if(hit){over=true;if(score>best){best=score;localStorage.setItem('flapBest',best);document.getElementById('best').textContent=best}document.getElementById('btn').style.display='inline-block';document.getElementById('btn').textContent='Play Again — Score '+score}
  draw();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  var grd=ctx.createLinearGradient(0,0,0,cv.height);grd.addColorStop(0,'#1c1d36');grd.addColorStop(1,'#101123');ctx.fillStyle=grd;ctx.fillRect(0,0,cv.width,cv.height);
  for(var i=0;i<pipes.length;i++){var p=pipes[i];var g=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);g.addColorStop(0,'#6842FF');g.addColorStop(1,'#8660FF');
    ctx.fillStyle=g;ctx.fillRect(p.x,0,PIPE_W,p.h);ctx.fillRect(p.x,p.h+GAP,PIPE_W,cv.height-(p.h+GAP));
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(p.x+8,0,6,p.h);ctx.fillRect(p.x+8,p.h+GAP,6,cv.height-(p.h+GAP));
    ctx.fillStyle='#0f1019';ctx.fillRect(p.x-4,p.h-10,PIPE_W+8,10);ctx.fillRect(p.x-4,p.h+GAP,PIPE_W+8,10)}
  var gb=ctx.createRadialGradient(bird.x,bird.y,2,bird.x,bird.y,bird.r+6);gb.addColorStop(0,'#ffd94d');gb.addColorStop(1,'#ffb84d');
  ctx.fillStyle=gb;ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,7);ctx.fill();
  ctx.fillStyle='#0f1019';ctx.fillRect(bird.x+bird.r-4,bird.y-5,10,4);ctx.fillRect(bird.x+bird.r-4,bird.y+2,10,4);
  ctx.fillStyle='#ff7a3d';ctx.beginPath();ctx.moveTo(bird.x-4,bird.y);ctx.lineTo(bird.x+16,bird.y-4);ctx.lineTo(bird.x+14,bird.y+6);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bird.x-3,bird.y-5,3,0,7);ctx.fill();ctx.fillStyle='#0f1019';ctx.beginPath();ctx.arc(bird.x-3,bird.y-5,1.6,0,7);ctx.fill();
  if(!started){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='700 22px Segoe UI';ctx.textAlign='center';ctx.fillText('Click / Space to flap',cv.width/2,cv.height/2)}
}
reset();
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
cv.addEventListener('pointerdown',function(e){e.preventDefault();flap()});
document.getElementById('btn').addEventListener('click',restart);
</script>
</body>
</html>
